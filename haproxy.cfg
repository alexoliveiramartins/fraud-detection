global
    maxconn 8192
    nbthread 1

defaults
    mode tcp
    no log
    option dontlognull
    retries 1
    timeout connect 1s
    timeout client 2s
    timeout server 2s
    timeout queue 2s

frontend fraud_front
    bind *:9999
    default_backend fraud_back

backend fraud_back
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    default-server inter 50ms fastinter 10ms rise 2 fall 2
    server api1 /var/run/rinha/api1.sock
    server api2 /var/run/rinha/api2.sock

    
